<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0b57d0">

  <meta
    name="mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <title>SNS Technician</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *{
      box-sizing:border-box;
    }

    html,body{
      height:100%;
      margin:0;
      background:#ffffff;
      font-family:Arial,sans-serif;
      overflow:hidden;
    }

    #loading{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b57d0;
      color:#ffffff;
      z-index:10;
      font-size:20px;
      font-weight:700;
    }

    iframe{
      width:100%;
      height:100dvh;
      border:0;
      display:block;
      background:#ffffff;
    }
  </style>
</head>


<body>

<div id="loading">
  SNS Technician Loading...
</div>


<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycby6-fwnjy-9AagLD40_52m5OcrskspcJUEtn-ivPMboLl1ks31BFw8AZmgeCm-PVOFh/exec?view=technician"
  allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
</iframe>


<script
src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js">
</script>

<script
src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js">
</script>


<script>

/* ==========================================
   SNS TECHNICIAN PWA
   NEW FIREBASE PROJECT
========================================== */


const frame =
  document.getElementById("app");


frame.addEventListener(
  "load",
  function(){

    document.getElementById(
      "loading"
    ).style.display =
      "none";

  }
);



/* ==========================================
   FIREBASE CONFIG
   NEW PROJECT = sns-maintenance-pwa
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDJVPZFRkzWKJ58cyIfaiuPqdvY4cYYzvE",

  authDomain:
    "sns-maintenance-pwa.firebaseapp.com",

  projectId:
    "sns-maintenance-pwa",

  storageBucket:
    "sns-maintenance-pwa.firebasestorage.app",

  messagingSenderId:
    "683218813920",

  appId:
    "1:683218813920:web:a091496adb477c47502185"

};


firebase.initializeApp(
  firebaseConfig
);


const messaging =
  firebase.messaging();


let swRegistration =
  null;



/* ==========================================
   IMPORTANT

   यहाँ NEW Firebase project
   sns-maintenance-pwa की
   Web Push certificate public key डालनी है
========================================== */

const VAPID_KEY =
  "BAC5d1x13WjnMMSiJQKMCVXYCN4HdeMg4bzCu3Mbj14SfFJtvs3dg2AgBvFWGRW_GaFFg0cnNZNyfr5tjclcots";



/* ==========================================
   PREPARE SCREEN-OFF PUSH
========================================== */

async function preparePush(){

  if(
    !("serviceWorker" in navigator)
  ){

    throw new Error(
      "Service Worker supported नहीं है।"
    );

  }


  /* Register Firebase service worker */

  swRegistration =
  await navigator.serviceWorker.register(
    "./firebase-messaging-sw.js"
  );


  await navigator
    .serviceWorker
    .ready;



  /* Notification Permission */

  let permission =
    Notification.permission;


  if(
    permission === "default"
  ){

    permission =
      await Notification
        .requestPermission();

  }


  if(
    permission !== "granted"
  ){

    throw new Error(
      "Notification permission Allow करें।"
    );

  }



  if(
    !VAPID_KEY ||
    VAPID_KEY.indexOf("PASTE_") === 0
  ){

    throw new Error(
      "New Firebase VAPID Key अभी set नहीं है।"
    );

  }



  /* Get FCM Token */

  const fcmToken =
    await messaging.getToken({

      vapidKey:
        VAPID_KEY,

      serviceWorkerRegistration:
        swRegistration

    });


  if(
    !fcmToken
  ){

    throw new Error(
      "FCM Token नहीं मिला।"
    );

  }


  console.log(
    "SNS NEW FCM TOKEN:",
    fcmToken
  );


  return fcmToken;

}



/* ==========================================
   TECHNICIAN APP ASKS TO ENABLE PUSH
========================================== */

window.addEventListener(
  "message",
  async function(event){

    const data =
      event.data || {};


    if(
      data.type !==
      "SNS_ENABLE_PUSH"
    ){

      return;

    }


    try{


      frame.contentWindow
        .postMessage({

          type:
            "SNS_PUSH_PROGRESS",

          message:
            "Notification enable हो रही है..."

        }, "*");



      const fcmToken =
        await preparePush();



      if(
        !data.bridgeUrl
      ){

        throw new Error(
          "Push bridge URL नहीं मिला।"
        );

      }


      if(
        !data.loginToken
      ){

        throw new Error(
          "Technician login token नहीं मिला। दोबारा login करें।"
        );

      }



      const separator =
        data.bridgeUrl
          .indexOf("?") >= 0
          ? "&"
          : "?";



      const bridgeUrl =

        data.bridgeUrl +

        separator +

        "mode=register" +

        "&loginToken=" +

        encodeURIComponent(
          data.loginToken
        ) +

        "&fcmToken=" +

        encodeURIComponent(
          fcmToken
        );



      let bridge =
        document.getElementById(
          "snsPushBridge"
        );


      if(!bridge){

        bridge =
          document.createElement(
            "iframe"
          );


        bridge.id =
          "snsPushBridge";


        bridge.style.display =
          "none";


        document.body
          .appendChild(
            bridge
          );

      }


      /*
       नया URL force करने के लिए
       पहले blank करें
      */

      bridge.src =
        "about:blank";


      setTimeout(
        function(){

          bridge.src =
            bridgeUrl;

        },
        100
      );


    }
    catch(error){


      console.error(
        "SNS PUSH ERROR:",
        error
      );


      frame.contentWindow
        .postMessage({

          type:
            "SNS_PUSH_ERROR",

          message:
            error &&
            error.message
            ? error.message
            : String(error)

        }, "*");

    }

  }
);



/* ==========================================
   RESULT FROM APPS SCRIPT PUSH BRIDGE
========================================== */

window.addEventListener(
  "message",
  function(event){

    const data =
      event.data || {};


    if(
      data.type ===
      "SNS_REGISTER_FCM_RESULT"
    ){

      console.log(
        "SNS REGISTER RESULT:",
        data
      );


      frame.contentWindow
        .postMessage(
          data,
          "*"
        );

    }

  }
);



/* ==========================================
   FOREGROUND MESSAGE
========================================== */

messaging.onMessage(
  function(payload){

    console.log(
      "Foreground notification:",
      payload
    );


    const title =
      payload.notification &&
      payload.notification.title
      ? payload.notification.title
      : "🚨 SNS Maintenance";


    const body =
      payload.notification &&
      payload.notification.body
      ? payload.notification.body
      : "New maintenance complaint";


    if(
      Notification.permission ===
      "granted"
    ){

      try{

        new Notification(
          title,
          {
            body:body,
            icon:"./icon-192.png"
          }
        );

      }
      catch(ignore){}

    }

  }
);

</script>

</body>
</html>
