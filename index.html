<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0"><title>SNS Technician</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial;background:#f4f7fb}
#app{width:100%;height:100dvh;border:0;background:#fff}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b57d0;color:#fff;font-weight:900;z-index:10}
#push{display:none;min-height:100dvh;padding:18px;align-items:center;justify-content:center}.card{width:min(100%,430px);background:#fff;border-radius:22px;padding:24px;text-align:center;box-shadow:0 15px 45px #0002}
button{width:100%;min-height:54px;border:0;border-radius:14px;background:#0b57d0;color:#fff;font-size:16px;font-weight:900}#status{margin-top:14px;font-weight:800;white-space:pre-wrap}.ok{color:#087a37}.bad{color:#b3261e}#back{display:none;margin-top:16px}</style></head><body>
<div id="normal"><div id="loading">SNS Technician Loading...</div><iframe id="app" src="https://script.google.com/macros/s/AKfycby6-fwnjy-9AagLD40_52m5OcrskspcJUEtn-ivPMboLl1ks31BFw8AZmgeCm-PVOFh/exec?view=technician" allow="camera;microphone;geolocation"></iframe></div>
<div id="push"><div class="card"><div style="font-size:56px">🔔</div><h2>Enable Screen-Off Alerts</h2><p>नई complaint की notification screen off में पाने के लिए नीचे button दबाएँ।</p>
<button id="allow">Allow Notifications</button><div id="status"></div><a id="back" href="https://snsn5450.github.io/SNS-Technician-PWA/">← Technician App खोलें</a></div></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script>
const q=new URLSearchParams(location.search), pushMode=q.get("mode")==="push";
const normal=document.getElementById("normal"),push=document.getElementById("push"),app=document.getElementById("app"),loading=document.getElementById("loading");
if(pushMode){normal.style.display="none";push.style.display="flex"}else app.onload=()=>loading.style.display="none";
firebase.initializeApp({apiKey:"AIzaSyDJVPZFRkzWKJ58cyIfaiuPqdvY4cYYzvE",authDomain:"sns-maintenance-pwa.firebaseapp.com",projectId:"sns-maintenance-pwa",storageBucket:"sns-maintenance-pwa.firebasestorage.app",messagingSenderId:"683218813920",appId:"1:683218813920:web:a091496adb477c47502185"});
const messaging=firebase.messaging(), VAPID="BAC5d1x13WjnMMSiJQKMCVXYCN4HdeMg4bzCu3Mbj14SfFJtvs3dg2AgBvFWGRW_GaFFg0cnNZNyfr5tjclcots", btn=document.getElementById("allow"),st=document.getElementById("status"),back=document.getElementById("back");
function status(t,ok){st.textContent=t;st.className=ok?"ok":"bad"}
async function token(){
 if(!("serviceWorker" in navigator))throw Error("Service Worker support नहीं है।");
 if(!("Notification" in window))throw Error("Notification support नहीं है।");
 const regs=await navigator.serviceWorker.getRegistrations();
 for(const r of regs) if(r.scope.includes("/SNS-Technician-PWA/")) await r.unregister();
 const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js?v=final-20260821",{scope:"./"});
 await navigator.serviceWorker.ready;
 let p=Notification.permission;if(p==="default")p=await Notification.requestPermission();
 if(p!=="granted")throw Error("Notification permission Allow नहीं हुई।");
 const t=await messaging.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
 if(!t||t.length<40)throw Error("FCM token नहीं मिला।");return t;
}
function save(t){return new Promise((resolve,reject)=>{
 const login=q.get("loginToken")||"",bridgeUrl=q.get("bridgeUrl")||"";
 if(!login)return reject(Error("Technician login token missing है।"));
 if(!bridgeUrl)return reject(Error("Apps Script URL missing है।"));

 const baseUrl=bridgeUrl.split("?")[0];
 const cb="snsPushRegisterCallback_"+Date.now()+"_"+Math.floor(Math.random()*100000);
 let done=false;

 function cleanup(){
   const old=document.getElementById("snsPushJsonp");
   if(old)old.remove();
   try{delete window[cb]}catch(e){}
 }

 const timer=setTimeout(()=>{
   if(done)return;
   done=true;
   cleanup();
   reject(Error("Token registration timeout."));
 },20000);

 window[cb]=function(d){
   if(done)return;
   done=true;
   clearTimeout(timer);
   cleanup();
   if(d&&d.success)resolve(d);
   else reject(Error(d&&d.message?d.message:"Token registration failed."));
 };

 const s=document.createElement("script");
 s.id="snsPushJsonp";
 s.onerror=function(){
   if(done)return;
   done=true;
   clearTimeout(timer);
   cleanup();
   reject(Error("Apps Script push register URL load नहीं हुआ।"));
 };

 const u=new URL(baseUrl);
 u.searchParams.set("view","pushregister");
 u.searchParams.set("callback",cb);
 u.searchParams.set("loginToken",login);
 u.searchParams.set("fcmToken",t);
 u.searchParams.set("t",Date.now());

 s.src=u.toString();
 document.body.appendChild(s);
})}
btn.onclick=async()=>{btn.disabled=true;try{status("1/3 Notification permission...",true);const t=await token();status("2/3 FCM token बन गया। Sheet में save हो रहा है...",true);const r=await save(t);status("✅ 3/3 Screen-Off Alerts Enabled\n"+(r.name||"")+" "+(r.mobile||""),true);back.style.display="inline-block"}catch(e){status("❌ "+(e.message||e),false);btn.disabled=false}};
</script></body></html>
