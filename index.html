<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SNS Technician</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#fff;font-family:Arial,sans-serif;overflow:hidden}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b57d0;color:white;z-index:10;font-size:20px;font-weight:700}
    iframe{width:100%;height:100dvh;border:0;display:block;background:#fff}
  </style>
</head>
<body>
  <div id="loading">SNS Technician Loading...</div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycby6-fwnjy-9AagLD40_52m5OcrskspcJUEtn-ivPMboLl1ks31BFw8AZmgeCm-PVOFh/exec?view=technician" allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>document.getElementById('loading').style.display='none');
    if ('serviceWorker' in navigator) {
      window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
